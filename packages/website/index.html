<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/png" href="/pageagent/brand/hero.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>PageAgent Connect — In-page AI agent</title>
		<meta
			name="description"
			content="PageAgent Connect: ship an in-page AI agent, log in model providers, and export a one-line integration for any site."
		/>
		<meta
			name="keywords"
			content="PageAgent Connect, PageAgent, AI Agent, GUI Agent, Web Automation, OpenAI-compatible, BYOK"
		/>
		<meta property="og:image" content="https://sushant-kataria.github.io/pageagent/brand/hero.png" />
		<meta property="og:url" content="https://sushant-kataria.github.io/pageagent" />
		<meta property="og:type" content="website" />
		<meta name="theme-color" content="#9fcf1f" />
		<meta name="color-scheme" content="light dark" />
		<meta name="author" content="PageAgent Connect" />
		<meta property="og:title" content="PageAgent Connect" />
		<meta
			property="og:description"
			content="Ship an in-page AI agent. Connect models in one command."
		/>
		<meta property="og:locale" content="en_US" />
		<meta property="og:locale:alternate" content="zh_CN" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<div id="root">
			<div id="sk">
				<p class="sk-text" id="sk-text">Loading...</p>
				<style>
					#sk {
						display: flex;
						align-items: center;
						justify-content: center;
						min-height: 100vh;
						background:
							radial-gradient(900px 500px at 12% -8%, rgba(159, 207, 31, 0.22), transparent 55%),
							linear-gradient(165deg, #f3f7f2 0%, #e7efe8 50%, #f7f3ee 100%);
					}
					.sk-text {
						font:
							500 14px/1 Figtree,
							system-ui,
							sans-serif;
						color: #4a6358;
						animation: skf 2s ease-in-out infinite;
					}
					@keyframes skf {
						0%,
						100% {
							opacity: 0.7;
						}
						50% {
							opacity: 0.35;
						}
					}
				</style>
			</div>
		</div>
		<script type="module" src="./src/main.tsx"></script>
		<script>
			const updateHtmlLang = () => {
				const lang = localStorage.getItem('i18nextLng') || navigator.language || 'en-US'
				document.documentElement.lang = lang
				const el = document.getElementById('sk-text')
				if (el) el.textContent = lang.startsWith('zh') ? '加载中...' : 'Loading...'
			}
			updateHtmlLang()
			window.addEventListener('storage', updateHtmlLang)
		</script>
	</body>
</html>
